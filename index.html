<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXORA TOPUP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Cpath d='M32 10c8 6 12 15 10 28H22C20 25 24 16 32 10z' fill='%23fff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0612;--card:#151022;--line:#2a2040;--tx:#f3eefc;--mu:#9a8fb5;--p1:#7c3aed;--p2:#d946ef;--ok:#34d399;--bad:#f43f5e;--g:linear-gradient(135deg,#7c3aed,#d946ef)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif}
body{background:radial-gradient(circle at 80% -10%,#3b1670 0,transparent 45%),var(--bg);min-height:100vh;padding-bottom:96px}
h1,h2,h3,.brand{font-family:Sora,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px}
header svg{width:44px;height:44px;filter:drop-shadow(0 4px 14px #7c3aed99)}
.brand{font-weight:800;font-size:19px;letter-spacing:.5px}.brand small{display:block;font:500 11px Inter;color:var(--mu);letter-spacing:2px}
main{padding:8px 16px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.note{background:#2a1450;border:1px solid #5b2fa8;border-radius:16px;padding:12px;color:#d8c7f5;margin:12px 0}
h2{font-size:18px;margin:16px 0 8px}
label{display:block;color:var(--mu);margin:10px 0 4px;font-size:13px}
input,select,textarea{width:100%;background:#1d1630;border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--tx);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--p2)}
button{font:600 15px Inter;border:0;border-radius:14px;padding:13px 16px;color:#fff;background:#2b2140;cursor:pointer}
.btn{background:var(--g);width:100%;margin-top:12px;box-shadow:0 8px 24px #7c3aed55}
.sm{padding:8px 12px;font-size:13px;border-radius:10px}.bad{background:var(--bad)}.ok{background:#059669}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.of{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer}
.of.on{border-color:var(--p2);box-shadow:0 0 0 3px #d946ef33,0 8px 24px #7c3aed44}
.of b{display:block;font-family:Sora;font-size:15px}.of span{color:#c4a6ff;font-weight:600;font-size:17px}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#2b2140}
.pendiente{color:#fbbf24}.aceptado{color:var(--ok)}.rechazado{color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.tabs button.on,.m.on{background:var(--g)}
.m{flex:1;background:#1d1630}.m[disabled]{opacity:.35}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:auto;display:flex;background:#151022ee;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:6px}
nav button{flex:1;background:none;color:var(--mu);font-size:12px;padding:10px 4px}nav button.on{background:#2a1450;color:#fff}
.mu{color:var(--mu);font-size:13px}.code{font:700 20px Sora;letter-spacing:3px;color:#e9d5ff}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#3b1670;border:1px solid var(--p2);padding:10px 16px;border-radius:14px;display:none;z-index:9;max-width:90%}
a{color:#e9b6ff}
@media(prefers-reduced-motion:no-preference){.of,button{transition:.15s}}
</style>
</head>
<body>
<div id="toast"></div>
<header><div id="logo"></div><div class="brand">NEXORA TOPUP<small>RECARGAS FREE FIRE</small></div></header>
<main id="view"></main>
<button id="botb" onclick="botT()" aria-label="Asistente" style="position:fixed;left:14px;bottom:96px;width:52px;height:52px;border-radius:50%;background:var(--g);font-size:24px;padding:0;z-index:5">🤖</button><div id="botp" class="card" style="display:none;position:fixed;left:12px;right:12px;bottom:158px;max-width:420px;z-index:5;max-height:55vh;overflow:auto"></div>
<nav id="nav" style="display:none"></nav>
<script>
// ====== CONFIGURA ESTO ======
const SB_URL='https://uzxyordzuazalbcuffaz.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6eHlvcmR6dWF6YWxiY3VmZmF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDk2MjAsImV4cCI6MjEwODYyNTYyMH0.eQGNCbKA18Sr3ZXDuTO3bg7SbqmGIWrlGO-Q-osqcHc';
const SUPPORT='53148263';
// ============================
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO='<svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M32 9c9 6 13 16 11 30H21C19 25 23 15 32 9z" fill="#fff"/><circle cx="32" cy="26" r="5" fill="#7c3aed"/><path d="M21 33l-8 10 9-2zM43 33l8 10-9-2z" fill="#f0abfc"/><path d="M27 42h10l-5 14z" fill="#fde68a"/></svg>';
$('#logo').innerHTML=LOGO;
const U={cup:'CUP',usdt:'USDT',saldo:'saldo',credito:'créditos'};
let me=null,tab='home',mode='login',offers=[],cfg={},sel=null,method='cup',gm=false,pidv='',atab='clientes',last=null;

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
const wa=t=>`https://wa.me/${SUPPORT}?text=${encodeURIComponent(t)}`;
async function loadMe(){const{data:{session}}=await sb.auth.getSession();if(!session){me=null;return}
  const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=data}
async function loadCfg(){const{data}=await sb.from('settings').select('*');cfg={};(data||[]).forEach(r=>cfg[r.key]=r.value)}

async function render(){
  const v=$('#view'),nav=$('#nav');
  if(!me){nav.style.display='none';return v.innerHTML=authV()}
  if(me.banned){nav.style.display='none';return v.innerHTML='<div class="card"><h2>Cuenta bloqueada</h2><p class="mu">Contacta al soporte.</p><button class="btn" onclick="logout()">Salir</button></div>'}
  if(!me.verified){nav.style.display='none';return v.innerHTML=verifyV()}
  const items=[['home','Principal'],['orders','Pedidos'],['notif','Avisos'],['me','Perfil']];if(me.role==='admin')items.push(['admin','Admin']);
  nav.style.display='flex';nav.innerHTML=items.map(([k,l])=>`<button data-k="${k}" class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  sb.from('notifications').select('scope').eq('user_id',me.id).eq('read',false).then(r=>{const d=r.data||[],u=d.filter(x=>x.scope!=='admin').length,a=d.length-u,b=nav.querySelector('[data-k=notif]'),c=nav.querySelector('[data-k=admin]');if(u&&b)b.textContent='Avisos ('+u+')';if(a&&c)c.textContent='Admin ('+a+')'});
  ({home:homeV,orders:ordersV,notif:notifV,me:meV,admin:adminV})[tab]()
}
function go(t){tab=t;last=null;render()}

// ---------- AUTH ----------
function authV(){const r=mode==='register';return `<div class="card"><h2>${r?'Crear cuenta':'Iniciar sesión'}</h2>
${r?'<label>Nombre</label><input id="a_n" autocomplete="name"><label>Número de teléfono</label><input id="a_p" type="tel" autocomplete="tel">':''}
<label>Correo electrónico</label><input id="a_e" type="email" autocomplete="email">
<label>Contraseña</label><input id="a_w" type="password" autocomplete="${r?'new-password':'current-password'}">
<button class="btn" onclick="${r?'signUp()':'signIn()'}">${r?'Crear cuenta':'Entrar'}</button>
<p class="mu" style="margin-top:14px;text-align:center">${r?'¿Ya tienes cuenta?':'¿Aún no tienes cuenta?'} <a href="#" onclick="mode='${r?'login':'register'}';render();return false">${r?'Inicia sesión':'Crea una'}</a></p></div>`}
async function signIn(){const{error}=await sb.auth.signInWithPassword({email:$('#a_e').value.trim().toLowerCase(),password:$('#a_w').value});
  if(error)return toast(/confirm/i.test(error.message)?'Falta confirmar el correo. Desactiva "Confirm email" en Supabase.':'Correo o contraseña incorrectos');
  await loadMe();if(!me)return toast('No se encontró tu perfil. Revisa que el SQL se ejecutó completo.');render()}
async function signUp(){const name=$('#a_n').value.trim(),phone=$('#a_p').value.trim(),email=$('#a_e').value.trim().toLowerCase(),password=$('#a_w').value;
  if(!name||!phone||!email||password.length<6)return toast('Completa todos los campos (contraseña de 6+ caracteres)');
  const{data,error}=await sb.auth.signUp({email,password,options:{data:{name,phone}}});
  if(error)return toast(error.message);
  if(data.user&&data.user.identities&&!data.user.identities.length)return toast('Ese correo ya tiene una cuenta. Inicia sesión.');
  if(!data.session){const r=await sb.auth.signInWithPassword({email,password});
    if(r.error)return toast('Cuenta creada, pero Supabase pide confirmar el correo. Desactiva "Confirm email" en Authentication → Providers → Email.')}
  await loadMe();if(!me)return toast('Cuenta creada, pero falta el perfil. Revisa que el SQL se ejecutó completo.');render()}
function verifyV(){return `<div class="card"><h2>Verifica tu cuenta</h2><p class="mu">Escribe al soporte por WhatsApp para recibir tu código de verificación (${SUPPORT}).</p>
<a href="${wa('Hola, necesito mi código de verificación. Mi correo: '+esc(me.email))}" target="_blank" rel="noopener"><button class="btn ok" style="background:#059669">Pedir código por WhatsApp</button></a>
<label>Código de verificación</label><input id="vc" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:20px">
<button class="btn" onclick="verify()">Verificar cuenta</button>
<button class="sm" style="margin-top:12px;width:100%" onclick="logout()">Salir</button></div>`}
async function verify(){const{data,error}=await sb.rpc('verify_account',{p_code:$('#vc').value});
  if(error||!data)return toast('Código incorrecto');await loadMe();toast('Cuenta verificada');render()}
async function logout(){await sb.auth.signOut();me=null;render()}

// ---------- OFERTAS ----------
const FF=`<svg viewBox="0 0 400 180" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%"><defs><linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e0b3a"/><stop offset=".55" stop-color="#6d28d9"/><stop offset="1" stop-color="#f97316"/></linearGradient><linearGradient id="fd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f7ff"/><stop offset="1" stop-color="#22a6ff"/></linearGradient><linearGradient id="ff" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#fde047"/></linearGradient></defs><rect width="400" height="180" fill="url(#fb)"/><circle cx="320" cy="40" r="90" fill="#fff" opacity=".06"/><path d="M200 18c18 30 46 44 46 84 0 30-20 52-46 52s-46-22-46-52c0-18 10-28 18-40 2 14 10 20 16 22-6-28 0-46 12-66z" fill="url(#ff)"/><path d="M200 70c10 16 24 24 24 46 0 16-10 28-24 28s-24-12-24-28c0-12 6-18 10-24 2 8 6 10 9 11-3-14 0-24 5-33z" fill="#fff" opacity=".35"/><g fill="url(#fd)" stroke="#fff" stroke-opacity=".6"><path d="M70 100l20-14h30l20 14-35 44z"/><path d="M300 110l14-10h22l14 10-25 32z"/></g></svg>`;
const proofCard=o=>o.method==='credito'||o.status!=='pendiente'?'':o.proof?'<div class="note">✓ Comprobante enviado. Lo revisaremos en breve.</div>':`<div class="card"><b>Comprobante de pago</b><p class="mu">Adjunta una imagen de la transferencia para agilizar la revisión.</p><label for="pf" style="border:2px dashed #7c3aed;border-radius:16px;padding:22px;text-align:center;color:#e9b6ff;cursor:pointer;margin-top:10px">📷 Adjuntar imagen</label><input id="pf" type="file" accept="image/*" hidden onchange="pf=this.files[0];$('#pn').textContent=pf?pf.name:''"><p id="pn" class="mu"></p><button class="btn" onclick="sendProof(${o.id})">Enviar a revisión</button></div>`;
let pf=null;
async function sendProof(id){if(!pf)return toast('Adjunta la imagen primero');
  try{const bmp=await createImageBitmap(pf),k=Math.min(1,1000/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=bmp.width*k;c.height=bmp.height*k;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8)),path=`${me.id}/${id}-${Date.now()}.jpg`;
  const{error}=await sb.storage.from('proofs').upload(path,blob,{contentType:'image/jpeg'});if(error)return toast(error.message);
  const r=await sb.rpc('set_proof',{p_order:id,p_path:path});if(r.error)return toast(r.error.message);
  toast('Comprobante enviado');pf=null;last=null;const{data:o}=await sb.from('orders').select('*').eq('id',id).single();oc[id]=o;$('#view').innerHTML=ticket(o)}catch(e){toast('No se pudo leer la imagen')}}
async function viewProof(path){const{data,error}=await sb.storage.from('proofs').createSignedUrl(path,300);if(error)return toast(error.message);
  const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000d;z-index:20;display:grid;place-items:center;padding:12px';d.onclick=()=>d.remove();d.innerHTML=`<img src="${data.signedUrl}" alt="Comprobante" style="max-width:100%;max-height:100%;border-radius:12px">`;document.body.appendChild(d)}
const pk=m=>m==='credito'?'price_credits':'price_'+m;
async function homeV(){
  if(last)return $('#view').innerHTML=last;
  const[{data}]=await Promise.all([sb.from('offers').select('*').eq('active',true).order('sort').order('id'),loadCfg()]);
  offers=data||[];drawHome()}
function drawHome(){
  if(!gm)return $('#view').innerHTML=`<h2>Juegos</h2><button class="of" style="width:100%;padding:0;overflow:hidden" onclick="gm=true;drawHome()"><div style="height:140px;position:relative">${FF}<img src="freefire.jpg" alt="" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></div><div style="padding:12px"><b>Free Fire</b><div class="mu">Recarga de diamantes por ID</div></div></button>`;
  const o=offers.find(x=>x.id===sel),ok=o&&o[pk(method)]>0;
  $('#view').innerHTML=`<button class="sm" onclick="gm=false;sel=null;drawHome()">← Juegos</button><h2>Método de pago</h2><div class="row">${['cup','usdt','saldo','credito'].map(m=>`<button class="m ${m===method?'on':''}" onclick="method='${m}';drawHome()">${U[m].toUpperCase()}</button>`).join('')}</div>
<h2>Player ID</h2><input id="pid" inputmode="numeric" placeholder="Introduce tu ID" value="${esc(pidv)}" oninput="pidv=this.value">
<h2>Oferta</h2><div class="grid">${offers.map(x=>`<button class="of ${x.id===sel?'on':''}" ${x[pk(method)]>0?'':'disabled style="opacity:.35"'} onclick="sel=${x.id};drawHome()"><b>${esc(x.name)}</b><span>${x[pk(method)]} ${U[method]}</span></button>`).join('')||'<p class="mu">No hay ofertas disponibles.</p>'}</div>
${ok?`<button class="btn" onclick="order()">Pagar ${o[pk(method)]} ${U[method]}</button>`:''}`}
async function order(){const pid=pidv.trim();if(!/^\d{6,14}$/.test(pid))return toast('Revisa tu Player ID');
  const{data,error}=await sb.rpc('create_order',{p_offer:sel,p_player:pid,p_method:method});if(error)return toast(error.message);sel=null;showNew(data)}
async function showNew(id){const{data:o}=await sb.from('orders').select('*').eq('id',id).single();await loadCfg();const a=o.amount;
  const how={cup:`Transfiere ${a} CUP a la tarjeta <b>${esc(cfg.card)}</b>`,saldo:`Envía ${a} de saldo móvil al <b>${esc(cfg.mobile)}</b>`,usdt:`Envía ${a} USDT (BEP20) a <b>${esc(cfg.usdt)}</b>`,credito:'Pagado con tus créditos.'}[o.method];
  last=`<div class="card"><p>${how}</p></div>`+ticket(o);$('#view').innerHTML=last}
const ST={pendiente:['EN PROCESO','Espere a que realicemos su recarga','#4f46e5,#7c3aed','#818cf8'],aceptado:['ENTREGADO','¡Su recarga se ha realizado con éxito!','#16a34a,#0d9488','#34d399'],rechazado:['RECHAZADO','No se pudo completar','#dc2626,#7f1d1d','#f87171']};
function ticket(o){const s=ST[o.status],ok=o.status==='aceptado',no=o.status==='rechazado',G='#22c55e';
  const dot=(c,t,m)=>`<div style="text-align:center"><div style="width:32px;height:32px;border-radius:50%;margin:auto;display:grid;place-items:center;background:${c};border:2px solid ${c==='transparent'?'#3b3358':c}">${m||''}</div><div class="mu" style="margin-top:4px">${t}</div></div>`;
  return `<h2 style="text-align:center;font-size:21px;color:${s[3]}">${s[1]}</h2><div class="card" style="padding:0;overflow:hidden"><div style="background:linear-gradient(135deg,${s[2]});padding:26px;text-align:center"><div style="font-size:46px">${no?'❌':ok?'✅':'💎'}</div><div style="letter-spacing:3px;font-size:12px">${o.kind==='credito'?'CRÉDITOS':'FREE FIRE'}</div><h1 style="font-size:26px">${esc(o.offer_name)}</h1><b>${s[0]}</b></div>
<div style="padding:16px"><div class="row sp" style="margin-bottom:14px">${dot(G,'Recibido','✓')}${dot(ok||no?G:'#3b82f6','En proceso',ok||no?'✓':'')}${dot(ok?G:no?'#ef4444':'transparent',no?'Rechazado':'Entregado',ok?'✓':no?'✕':'')}</div>
<div class="card"><span class="mu">TOTAL</span><h2 style="margin:2px 0">${o.amount} ${U[o.method]}</h2></div><div class="grid"><div class="card"><span class="mu">ID</span><br><b>${esc(o.player_id)}</b></div><div class="card"><span class="mu">Método</span><br><b>${U[o.method]}</b></div></div>
<p class="mu">${new Date(o.created_at).toLocaleString('es')}</p><p class="mu">Número del pedido <b style="font-size:20px;color:#fff">#${o.id}</b></p>${no&&o.method==='credito'?'<p>Te devolvimos tus créditos.</p>':''}</div></div>${proofCard(o)}<button class="btn" onclick="go('home')">Regresar</button>`}

// ---------- PEDIDOS / AVISOS / PERFIL ----------
const orderRow=(o,adm,click)=>`<div class="card" ${click?`onclick="${click}" style="cursor:pointer"`:''}><div class="row sp"><b>#${o.id} · ${esc(o.offer_name)}</b><span class="pill ${o.status}">${o.status}</span></div>
<p class="mu">ID ${esc(o.player_id)} · ${o.amount} ${U[o.method]} · ${new Date(o.created_at).toLocaleString('es')}${adm&&o.profiles?'<br>'+esc(o.profiles.name)+' · '+esc(o.profiles.email):''}</p>
${adm?`<div class="row" style="margin-top:10px">${o.proof?`<button class="sm" style="background:var(--g)" onclick="viewProof('${o.proof}')">Ver captura</button>`:o.method!=='credito'&&o.status==='pendiente'?'<span class="mu">Sin captura aún</span>':''}${o.status==='pendiente'?`<button class="sm ok" onclick="setSt(${o.id},'aceptado')">Aceptar</button><button class="sm bad" onclick="setSt(${o.id},'rechazado')">Rechazar</button>`:''}</div>`:''}</div>`;
let oc={};
async function ordersV(){const{data}=await sb.from('orders').select('*').eq('user_id',me.id).order('id',{ascending:false});(data||[]).forEach(o=>oc[o.id]=o);
  $('#view').innerHTML='<h2>Mis pedidos</h2>'+((data||[]).map(o=>orderRow(o,0,'openO('+o.id+')')).join('')||'<p class="mu">Aún no tienes pedidos. Elige un juego en Principal.</p>')}
function openO(id){$('#view').innerHTML=ticket(oc[id])}
async function notifV(){const{data}=await sb.from('notifications').select('*').eq('user_id',me.id).eq('scope','user').order('id',{ascending:false}).limit(50);
  $('#view').innerHTML='<h2>Avisos</h2>'+((data||[]).map(n=>`<div class="card" ${n.read?'':'style="border-color:#d946ef"'}><b>${esc(n.title)}</b><p>${esc(n.body)}</p><span class="mu">${new Date(n.created_at).toLocaleString('es')}</span></div>`).join('')||'<p class="mu">Sin avisos por ahora.</p>');
  sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('scope','user').eq('read',false).then(()=>{})}
async function meV(){await loadMe();$('#view').innerHTML=`<div class="card"><h2 style="margin-top:0">${esc(me.name)}</h2><p class="mu">${esc(me.email)}<br>${esc(me.phone)}</p></div>
<div class="card"><span class="mu">Tus créditos</span><h1 style="font-size:36px">${me.credits}</h1><button class="btn" onclick="buyV()">Comprar créditos</button></div>
<a href="${wa('Hola, necesito ayuda con NEXORA TOPUP')}" target="_blank" rel="noopener"><button class="btn ok" style="background:#059669">Hablar con soporte</button></a>
<button class="btn" style="background:#2b2140;box-shadow:none" onclick="logout()">Cerrar sesión</button>`}
let bq=10,bm='cup';
async function buyV(){await loadCfg();drawBuy()}
function drawBuy(){const p=+cfg['pc_'+bm];$('#view').innerHTML=`<button class="sm" onclick="go('me')">← Perfil</button><h2>Comprar créditos</h2><h2>Método de pago</h2><div class="row">${['cup','usdt','saldo'].map(m=>`<button class="m ${m===bm?'on':''}" onclick="bm='${m}';drawBuy()">${U[m].toUpperCase()}</button>`).join('')}</div>
<h2>Cantidad</h2><div class="row">${[5,10,25,50,100].map(n=>`<button class="m ${n===bq?'on':''}" onclick="bq=${n};drawBuy()">${n}</button>`).join('')}</div><label>O escribe otra cantidad</label><input type="number" min="1" value="${bq}" onchange="bq=+this.value||1;drawBuy()">
<p class="mu" style="margin-top:10px">1 crédito = ${p} ${U[bm]}</p><button class="btn" onclick="buy()">Pagar ${+(p*bq).toFixed(2)} ${U[bm]}</button>`}
async function buy(){const{data,error}=await sb.rpc('buy_credits',{p_qty:bq,p_method:bm});if(error)return toast(error.message);showNew(data)}

// ---------- ADMIN ----------
async function setSt(id,s){const{error}=await sb.from('orders').update({status:s}).eq('id',id);if(error)return toast(error.message);toast('Pedido '+s);adminV()}
function adminV(){const T=[['clientes','Clientes'],['pedidos','Pedidos'],['creditos','Créditos'],['avisos','Avisos'],['ofertas','Ofertas'],['pagos','Pagos']];
  $('#view').innerHTML=`<div class="tabs">${T.map(([k,l])=>`<button class="${atab===k?'on':''}" onclick="atab='${k}';adminV()">${l}</button>`).join('')}</div><div id="ad"></div>`;({clientes:aCli,pedidos:aPed,creditos:aCred,avisos:aAv,ofertas:aOf,pagos:aPay})[atab]()}
async function aCli(q){if(q===undefined){$('#ad').innerHTML='<input placeholder="Buscar nombre, correo o número" oninput="aCli(this.value)" style="margin:12px 0"><div id="cl"></div>';q=''}
  const{data:u}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
  $('#cl').innerHTML=(u||[]).filter(p=>(p.name+p.email+p.phone).toLowerCase().includes(q.toLowerCase())).map(p=>`<div class="card row sp"><div><b>${esc(p.name)}</b><div class="mu">${esc(p.email)}</div></div><div class="row"><span class="pill">${p.banned?'BANEADO':p.role==='admin'?'ADMIN':p.verified?'VERIFICADO':'SIN VERIFICAR'}</span><button class="sm" style="background:var(--g)" onclick="aCliD('${p.id}')">Ver</button></div></div>`).join('')}
async function aCliD(id){const[{data:p},{data:c},{data:os}]=await Promise.all([sb.from('profiles').select('*').eq('id',id).single(),sb.from('codes').select('code').eq('user_id',id).maybeSingle(),sb.from('orders').select('*').eq('user_id',id).order('id',{ascending:false}).limit(30)]);
  $('#ad').innerHTML=`<button class="sm" onclick="aCli()" style="margin:12px 0">← Clientes</button><div class="card"><h3>${esc(p.name)}</h3><p class="mu">${esc(p.email)} · ${esc(p.phone)}</p>${p.verified?'':`<p>Código: <span class="code">${esc(c?.code)}</span></p>`}
<label>Créditos</label><div class="row"><input id="cc" type="number" step="any" value="${p.credits}" style="flex:1"><button class="sm ok" onclick="upP('${id}',{credits:+$('#cc').value})">Guardar</button></div>
<div class="row" style="margin-top:12px">${p.verified?'':`<a href="https://wa.me/${encodeURIComponent((p.phone||'').replace(/\D/g,''))}?text=${encodeURIComponent('Tu código de NEXORA TOPUP es '+(c?.code||''))}" target="_blank" rel="noopener"><button class="sm ok">Enviar código</button></a><button class="sm" onclick="upP('${id}',{verified:true})">Verificar sin código</button>`}
${p.id===me.id?'':`<button class="sm" onclick="if(confirm('¿Cambiar rol?'))upP('${id}',{role:'${p.role==='admin'?'user':'admin'}',verified:true})">${p.role==='admin'?'Quitar admin':'Hacer admin'}</button><button class="sm bad" onclick="upP('${id}',{banned:${!p.banned}})">${p.banned?'Quitar baneo':'Banear cliente'}</button>`}</div></div>
<div class="card"><label>Enviar mensaje</label><input id="mm" placeholder="Mensaje para el cliente"><button class="btn" onclick="sendM('${id}')">Enviar mensaje</button></div><h2>Pedidos del cliente</h2>${(os||[]).map(o=>orderRow(o,true)).join('')||'<p class="mu">Sin pedidos.</p>'}`}
async function upP(id,v){const{error}=await sb.from('profiles').update(v).eq('id',id);if(error)return toast(error.message);toast('Listo');aCliD(id)}
async function sendM(id){const t=$('#mm').value.trim();if(!t)return;const{error}=await sb.from('notifications').insert({user_id:id,title:'Mensaje del soporte',body:t});toast(error?error.message:'Mensaje enviado');$('#mm').value=''}
async function aCred(){const f=(i,b,c)=>`<div class="card"><input id="ce${i}" type="email" placeholder="Correo del cliente"><input id="cq${i}" type="number" step="any" placeholder="Cantidad de créditos" style="margin-top:8px"><button class="btn" style="${c}" onclick="admCr(${b})">${b>0?'Enviar':'Quitar'}</button></div>`;
  $('#ad').innerHTML=`<div class="card" style="background:linear-gradient(135deg,#4f46e5,#9333ea);margin-top:12px"><span>Tu billetera de admin</span><h1 style="font-size:44px">∞ créditos</h1></div><h2>Enviar créditos</h2>${f(1,1,'')}<h2>Quitar créditos</h2>${f(2,-1,'background:var(--bad);box-shadow:none')}`}
async function admCr(sg){const i=sg>0?1:2,e=$('#ce'+i).value.trim().toLowerCase(),q=+$('#cq'+i).value;if(!e||!(q>0))return toast('Completa correo y cantidad');
  const{error}=await sb.rpc('admin_add_credits',{p_email:e,p_qty:q*sg});toast(error?error.message:'Listo');if(!error){$('#ce'+i).value='';$('#cq'+i).value=''}}
async function aAv(){const{data}=await sb.from('notifications').select('*').eq('user_id',me.id).eq('scope','admin').order('id',{ascending:false}).limit(50);
  $('#ad').innerHTML=(data||[]).map(n=>`<div class="card" ${n.read?'':'style="border-color:#d946ef"'}><b>${esc(n.title)}</b><p>${esc(n.body)}</p><span class="mu">${new Date(n.created_at).toLocaleString('es')}</span></div>`).join('')||'<p class="mu" style="margin-top:12px">Sin avisos de admin.</p>';
  sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('scope','admin').eq('read',false).then(()=>{})}
async function aPed(){const{data}=await sb.from('orders').select('*,profiles(name,email)').order('id',{ascending:false}).limit(100);
  $('#ad').innerHTML=(data||[]).map(o=>orderRow(o,true)).join('')||'<p class="mu">Sin pedidos todavía.</p>'}
async function aOf(){const{data}=await sb.from('offers').select('*').order('sort').order('id');
  const f=(o)=>`<div class="card"><label>Nombre</label><input id="n${o.id}" value="${esc(o.name)}"><div class="grid"><div><label>Precio CUP</label><input id="c${o.id}" type="number" step="any" value="${o.price_cup}"></div><div><label>Precio USDT</label><input id="u${o.id}" type="number" step="any" value="${o.price_usdt}"></div><div><label>Precio saldo</label><input id="s${o.id}" type="number" step="any" value="${o.price_saldo}"></div><div><label>Precio créditos</label><input id="r${o.id}" type="number" step="any" value="${o.price_credits}"></div><div><label>Orden</label><input id="o${o.id}" type="number" value="${o.sort}"></div></div>
<p class="mu" style="margin-top:6px">Pon 0 en un precio para desactivar ese método. ${o.active?'Visible':'Oculta'}.</p>
<div class="row" style="margin-top:8px"><button class="sm ok" onclick="saveO(${o.id})">Guardar</button><button class="sm" onclick="tgO(${o.id},${!o.active})">${o.active?'Ocultar':'Mostrar'}</button><button class="sm bad" onclick="if(confirm('¿Borrar oferta?'))delO(${o.id})">Borrar</button></div></div>`;
  $('#ad').innerHTML=`<div class="card"><h3>Nueva oferta</h3><label>Nombre</label><input id="nn" placeholder="Ej.: 110 Diamantes"><div class="grid"><div><label>CUP</label><input id="nc" type="number" value="0"></div><div><label>USDT</label><input id="nu" type="number" step="any" value="0"></div><div><label>Saldo</label><input id="ns" type="number" value="0"></div></div><button class="btn" onclick="addO()">Agregar oferta</button></div>`+(data||[]).map(f).join('')}
async function addO(){const n=$('#nn').value.trim();if(!n)return toast('Pon un nombre');const{error}=await sb.from('offers').insert({name:n,price_cup:+$('#nc').value,price_usdt:+$('#nu').value,price_saldo:+$('#ns').value,sort:99});if(error)return toast(error.message);aOf()}
async function saveO(i){const{error}=await sb.from('offers').update({name:$('#n'+i).value,price_cup:+$('#c'+i).value,price_usdt:+$('#u'+i).value,price_saldo:+$('#s'+i).value,price_credits:+$('#r'+i).value,sort:+$('#o'+i).value}).eq('id',i);toast(error?error.message:'Oferta guardada')}
async function tgO(i,a){await sb.from('offers').update({active:a}).eq('id',i);aOf()}
async function delO(i){await sb.from('offers').delete().eq('id',i);aOf()}
async function aPay(){await loadCfg();$('#ad').innerHTML=`<div class="note">Cambia estos datos con cuidado: los clientes los ven al instante y mandan su dinero ahí.</div><div class="card"><label>Tarjeta (CUP)</label><input id="k1" value="${esc(cfg.card)}"><label>Número para saldo móvil</label><input id="k2" value="${esc(cfg.mobile)}"><label>Dirección USDT (BEP20)</label><input id="k3" value="${esc(cfg.usdt)}"><label>Valor de 1 crédito en CUP</label><input id="p1" type="number" step="any" value="${esc(cfg.pc_cup)}"><label>Valor de 1 crédito en USDT</label><input id="p2" type="number" step="any" value="${esc(cfg.pc_usdt)}"><label>Valor de 1 crédito en saldo</label><input id="p3" type="number" step="any" value="${esc(cfg.pc_saldo)}"><button class="btn" onclick="savePay()">Guardar datos de pago</button></div>`}
async function savePay(){const{error}=await sb.from('settings').upsert([{key:'card',value:$('#k1').value.trim()},{key:'mobile',value:$('#k2').value.trim()},{key:'usdt',value:$('#k3').value.trim()},{key:'pc_cup',value:$('#p1').value},{key:'pc_usdt',value:$('#p2').value},{key:'pc_saldo',value:$('#p3').value}]);toast(error?error.message:'Datos guardados')}

const QA=[['¿Cómo recargo diamantes?','1) En Principal toca Free Fire. 2) Elige método de pago, escribe tu ID y elige la oferta. 3) Paga y envía la captura por WhatsApp. 4) Sigue tu pedido en Pedidos.'],['¿Cómo compro créditos?','Ve a Perfil → Comprar créditos, elige método y cantidad y paga. Cuando se confirme verás tus créditos en Perfil y podrás pagar recargas con ellos.'],['¿Cuánto tarda mi recarga?','Hasta 10 minutos después de confirmar el pago. Te avisamos en Avisos.'],['¿Por qué rechazaron mi pedido?','Suele ser un ID incorrecto o un pago que no se encontró. Si pagaste con créditos, se devuelven solos. Escribe al soporte.'],['Hablar con soporte',null]];
function botT(){const p=$('#botp');p.style.display=p.style.display==='block'?'none':'block';botM()}
function botM(a){$('#botp').innerHTML=`<b>Asistente NEXORA</b><p style="margin:8px 0" class="${a?'':'mu'}">${a||'¿En qué te ayudo?'}</p>`+QA.map(([q,r],i)=>`<button class="sm" style="display:block;width:100%;margin-top:6px;text-align:left" onclick="${r?`botM(QA[${i}][1])`:`window.open('${wa('Hola, necesito ayuda')}')`}">${q}</button>`).join('')}
sb.auth.onAuthStateChange((e)=>{if(e==='SIGNED_OUT'){me=null;render()}});
loadMe().then(render);
</script>
</body>
</html>
